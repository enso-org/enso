# To enable a single logger in tests and send its logs to the console, specify
# the logger name in the `logger` section, and use `default-appender = console`.
# For example: `logger { org.enso.compiler.pass.lint.UnusedImports = trace }`.
logging-service {
  logger {
  }
  appenders = [
    {
      name = "memory"
    },
    {
      name = "console"
      pattern = "[%level] [%d{yyyy-MM-ddTHH:mm:ssXXX}] [%logger] %msg%n"
    }
  ]
  default-appender = memory
  log-level = "warn"
}
