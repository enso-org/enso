# This file is not auto-generated. Feel free to edit it.

# This workflow automatically adds the "-libs-API-change" label to
# pull requests that change the public API of some standard library.

name: Std Libs API Change Label

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  # This job determines if there are any changes to the API files in std libs.
  docs-api-changed-files:
    runs-on: ubuntu-latest
    name: Changed API docs files
    outputs:
      any_changed: ${{ steps.docs-api-changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Get changed files
        id: docs-api-changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            distribution/lib/Standard/**/docs/api/*.md
      - name: List all changed files
        run: |
          if [[ "${{ steps.docs-api-changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "API docs files changed"
          fi

  add-label:
    runs-on: ubuntu-latest
    needs: [docs-api-changed-files]
    if: needs.docs-api-changed-files.outputs.any_changed == 'true'
    steps:
      - name: Add label to the PR
        uses: actions-ecosystem/action-add-label@v1
        with:
          labels: "-libs-API-change"
